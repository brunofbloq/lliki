[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lliki"
version = "0.2.1"
description = "Local repository wiki bootstrap and maintenance CLI for humans and coding tools"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "brunofbloq"}]
keywords = ["wiki", "repository", "documentation", "llm", "claude", "hermes", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
lliki = "lliki.cli:main"

[project.urls]
Homepage = "https://github.com/brunofbloq/lliki"
Repository = "https://github.com/brunofbloq/lliki"
Issues = "https://github.com/brunofbloq/lliki/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lliki = ["templates/**/*"]
